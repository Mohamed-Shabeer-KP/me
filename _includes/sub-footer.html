<!-- ✅ html2pdf library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<!-- ✅ Download PDF Button -->
<a href="#" onclick="downloadPDF(); return false;" id="printBtn"
   style="
     position: fixed;
     bottom: 20px;
     right: 20px;
     background: #2c3e50;
     color: #fff;
     padding: 10px 16px;
     border-radius: 6px;
     text-decoration: none;
     font-size: 14px;
     box-shadow: 0 2px 6px rgba(0,0,0,0.2);
     z-index: 1000;
   ">
  ⬇ Download PDF
</a>

<!-- ✅ Script -->

<script>
function downloadPDF() {

  const element = document.body.cloneNode(true);

  // ✅ Remove grey bar (IMPORTANT FIX)
  const header = element.querySelector('.site-header');
  if (header) {
    header.style.borderTop = 'none';
    header.style.borderBottom = 'none';
    header.style.boxShadow = 'none';
  }

  // ❌ Remove navbar
  const nav = element.querySelector('.site-nav');
  if (nav) nav.remove();

  // ❌ Remove social links
  const social = element.querySelector('.social-links');
  if (social) social.remove();

  const socialList = element.querySelector('.social-media-list');
  if (socialList) socialList.remove();

  // ❌ Remove button
  const btn = element.querySelector('#printBtn');
  if (btn) btn.remove();

  const opt = {
  margin: [10, 10, 10, 10],
  filename: document.title.replace(/\s+/g, '_') + '.pdf',
  image: { type: 'jpeg', quality: 0.98 },
  html2canvas: { 
    scale: 2,
    useCORS: true,
    scrollY: 0   // ✅ important for full rendering
  },
  jsPDF: { 
    unit: 'px',
    format: [document.body.scrollWidth, document.body.scrollHeight], // ✅ full height
    orientation: 'portrait'
  }
};

  html2pdf().set(opt).from(element).save();
}
</script>

<!-- ✅ Print/PDF styling -->
<style>
 /* ❌ Remove ONLY the grey bar + divider */@media print {
  .site-header {
    border-top: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
  }

  /* ❌ Remove navbar/menu only */
  .site-nav {
    display: none !important;
  }

  /* ❌ Remove social links */
  .social-links,
  .social-media-list {
    display: none !important;
  }

  /* ❌ Remove download button */
  #printBtn {
    display: none !important;
  }

  /* ✅ Prevent breaking inside text blocks */
  p, li {
    page-break-inside: avoid;
    break-inside: avoid;
  }

  /* ✅ Keep headings with content */
  h1, h2, h3 {
    page-break-after: avoid;
  }

  /* ✅ Avoid breaking sections */
  .home, .page-content, .wrapper {
    page-break-inside: avoid;
  }

  @media print {
     .site-header,
     .page-content,
     .wrapper {
       page-break-inside: avoid !important;
       break-inside: avoid !important;
     }
 }
}
</style>
