<!-- ✅ html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<!-- 🌙 THEME TOGGLE SWITCH -->
<label id="themeToggle"
  style="
    position: fixed;
    bottom: 70px;
    right: 20px;
    width: 120px;
    height: 40px;
    z-index: 1000;
    cursor: pointer;
  ">

  <input type="checkbox" id="themeCheckbox" style="display:none;" onchange="toggleDarkMode()">

  <div id="toggleTrack"
    style="
      width: 100%;
      height: 100%;
      background: #ccc;
      border-radius: 30px;
      position: relative;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 16px;
    ">

    <span>☀</span>

    <span id="toggleCircle"
      style="
        position: absolute;
        width: 28px;
        height: 28px;
        background: white;
        border-radius: 50%;
        left: 6px;
        top: 6px;
        transition: 0.3s;
      ">
    </span>

    <span>🌙</span>
  </div>
</label>

<!-- ✅ DOWNLOAD BUTTON -->
<a href="#" onclick="downloadPDF(); return false;" id="printBtn"
  style="
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 120px;
    height: 40px;
    line-height: 20px;
    text-align: center;
    background: #2c3e50;
    color: #fff;
    padding: 10px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    z-index: 1000;
  ">
  ⬇ Download
</a>

<!-- ✅ SCRIPT -->
<script>

// ✅ PDF DOWNLOAD
function downloadPDF() {

  const element = document.body.cloneNode(true);

  // Remove grey bar
  const header = element.querySelector('.site-header');
  if (header) {
    header.style.borderTop = 'none';
    header.style.borderBottom = 'none';
    header.style.boxShadow = 'none';
  }

  // Remove navbar
  const nav = element.querySelector('.site-nav');
  if (nav) nav.remove();

  // Remove social links
  const social = element.querySelector('.social-links');
  if (social) social.remove();

  const socialList = element.querySelector('.social-media-list');
  if (socialList) socialList.remove();

  // Remove buttons
  const btn = element.querySelector('#printBtn');
  if (btn) btn.remove();

  const toggle = element.querySelector('#themeToggle');
  if (toggle) toggle.remove();

  const opt = {
    margin: [10, 10, 10, 10],
    filename: "Mohamed_Shabeer_Resume.pdf",
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollY: 0 },
    jsPDF: {
      unit: 'px',
      format: [document.body.scrollWidth, document.body.scrollHeight],
      orientation: 'portrait'
    }
  };

  html2pdf().set(opt).from(element).save();
}


// ✅ THEME TOGGLE
function toggleDarkMode() {
  document.body.classList.toggle("dark-mode");

  const isDark = document.body.classList.contains("dark-mode");
  localStorage.setItem("theme", isDark ? "dark" : "light");

  updateToggleUI();
}


// ✅ UPDATE TOGGLE UI
function updateToggleUI() {
  const circle = document.getElementById("toggleCircle");
  const track = document.getElementById("toggleTrack");
  const checkbox = document.getElementById("themeCheckbox");

  const isDark = document.body.classList.contains("dark-mode");

  if (isDark) {
    circle.style.transform = "translateX(80px)";
    track.style.background = "#4caf50";
    checkbox.checked = true;
  } else {
    circle.style.transform = "translateX(0)";
    track.style.background = "#ccc";
    checkbox.checked = false;
  }
}


// ✅ LOAD THEME (AUTO)
window.onload = function () {

  // Auto detect system theme (if no saved value)
  if (!localStorage.getItem("theme")) {
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (prefersDark) {
      document.body.classList.add("dark-mode");
    }
  }

  // Load saved theme
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  updateToggleUI();
};

</script>

<!-- ✅ STYLES -->
<style>

/* ✅ SMOOTH TRANSITION */
body {
  transition: background 0.3s, color 0.3s;
}

/* ✅ PURE DARK MODE (no grey anywhere) */
body.dark-mode,
body.dark-mode .site-header,
body.dark-mode .site-footer,
body.dark-mode .page-content,
body.dark-mode .wrapper {
  background: #000 !important;
  color: #e0e0e0 !important;
}

/* ✅ TEXT */
body.dark-mode h1,
body.dark-mode h2,
body.dark-mode h3 {
  color: #ffffff;
}

/* ✅ LINKS */
body.dark-mode a {
  color: #90caf9;
}

/* ✅ REMOVE SOCIAL ICON BOXES */
body.dark-mode .social-media-list a {
  border: none !important;
  box-shadow: none !important;
}

/* ✅ ICON COLOR */
body.dark-mode .social-media-list i {
  color: #ccc;
}

/* ✅ REMOVE GREY BAR IN PRINT */
@media print {

  .site-header {
    border-top: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
  }

  .site-nav {
    display: none !important;
  }

  .social-links,
  .social-media-list {
    display: none !important;
  }

  #printBtn,
  #themeToggle {
    display: none !important;
  }
}

</style>
