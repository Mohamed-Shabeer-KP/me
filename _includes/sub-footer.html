<!-- ✅ html2pdf library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<!-- ✅ Download PDF Button -->
<a href="#" onclick="downloadPDF(); return false;" id="printBtn"
   style="
     position: fixed;
     bottom: 20px;
     right: 20px;
     background: #2c3e50;
     color: #fff;
     padding: 10px 16px;
     border-radius: 6px;
     text-decoration: none;
     font-size: 14px;
     box-shadow: 0 2px 6px rgba(0,0,0,0.2);
     z-index: 1000;
   ">
  ⬇ Download PDF
</a>

<!-- ✅ Script -->

<script>
function downloadPDF() {

  // ✅ Clone full page
  const element = document.body.cloneNode(true);

  // ❌ Remove social links
  const social = element.querySelector('.social-links');
  if (social) social.remove();

  const socialList = element.querySelector('.social-media-list');
  if (socialList) socialList.remove();

  // ❌ Remove button itself
  const btn = element.querySelector('#printBtn');
  if (btn) btn.remove();

  const opt = {
    margin: [10, 10, 10, 10],
    filename: document.title.replace(/\s+/g, '_') + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };

  html2pdf().set(opt).from(element).save();
}
</script>

<!-- ✅ Print/PDF styling -->
<style>
@media print {

  /* ✅ Remove grey top bar and bottom border */
  .site-header {
    border-top: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
  }

  /* ✅ Remove extra spacing from navbar */
  .site-header .wrapper {
    padding-top: 0 !important;
    padding-bottom: 0 !important;
  }

  /* ✅ Hide only navbar-specific elements if any exist */
  .site-nav {
    display: none !important;
  }

  /* ❌ Remove social links */
  .social-links,
  .social-media-list {
    display: none !important;
  }

  /* ❌ Remove button */
  #printBtn {
    display: none !important;
  }
}
</style>
