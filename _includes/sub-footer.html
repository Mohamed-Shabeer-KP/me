<!-- ✅ html2pdf library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<!-- ✅ Download PDF Button -->
<a href="#" onclick="downloadPDF(); return false;"
   id="printBtn"
   style="
     position: fixed;
     bottom: 20px;
     right: 20px;
     background: #2c3e50;
     color: #fff;
     padding: 10px 16px;
     border-radius: 6px;
     text-decoration: none;
     font-size: 14px;
     box-shadow: 0 2px 6px rgba(0,0,0,0.2);
     z-index: 1000;
   ">
  ⬇ Download PDF
</a>

<!-- ✅ Script -->
<script>
function downloadPDF() {
  const element = document.querySelector('.page-content'); // ✅ Only main content

  const opt = {
    margin: [10, 10, 10, 10],
    filename: document.title.replace(/\s+/g, '_') + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { 
      scale: 2,
      useCORS: true
    },
    jsPDF: { 
      unit: 'mm', 
      format: 'a4', 
      orientation: 'portrait' 
    },
    pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
  };

  html2pdf().set(opt).from(element).save();
}
</script>

<!-- ✅ Hide button + unwanted elements in PDF -->
<style>
@media print {
  /* ❌ Hide PDF button */
  #printBtn {
    display: none !important;
  }

  /* ✅ KEEP header & footer (so no display:none here) */

  /* ❌ Hide social links (Minima specific) */
  .social-media-list,
  .footer-col ul,
  .footer-col-2,
  .footer-col-3 {
    display: none !important;
  }
}
</style>
