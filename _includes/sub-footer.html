<!-- ✅ html2pdf library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<!-- ✅ Download PDF Button -->
<a href="#" onclick="downloadPDF(); return false;" id="printBtn"
   style="
     position: fixed;
     bottom: 20px;
     right: 20px;
     background: #2c3e50;
     color: #fff;
     padding: 10px 16px;
     border-radius: 6px;
     text-decoration: none;
     font-size: 14px;
     box-shadow: 0 2px 6px rgba(0,0,0,0.2);
     z-index: 1000;
   ">
  ⬇ Download PDF
</a>

<!-- ✅ Script -->

<script>
function downloadPDF() {

  // ✅ Clone full page
  const element = document.body.cloneNode(true);

  // ✅ Keep only site-title from header
  const header = element.querySelector('.site-header');
  if (header) {
    const title = header.querySelector('.site-title');

    if (title) {
      // Create a simple clean header
      const newHeader = document.createElement('div');
      // newHeader.style.textAlign = "center";
      newHeader.style.fontSize = "22px";
      newHeader.style.fontWeight = "bold";
      newHeader.style.marginBottom = "10px";
      newHeader.innerText = title.innerText;

      header.parentNode.replaceChild(newHeader, header);
    } else {
      header.remove();
    }
  }

  // ❌ Remove social links
  const social = element.querySelector('.social-links');
  if (social) social.remove();

  const socialList = element.querySelector('.social-media-list');
  if (socialList) socialList.remove();

  // ❌ Remove button itself
  const btn = element.querySelector('#printBtn');
  if (btn) btn.remove();

  const opt = {
    margin: [10, 10, 10, 10],
    filename: document.title.replace(/\s+/g, '_') + '.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };

  html2pdf().set(opt).from(element).save();
}
</script>

<!-- ✅ Print/PDF styling -->
<style>
@media print {

  /* ❌ Remove navbar */
  .site-header {
    display: none !important;
  } 

  /* ❌ Remove social links */
  .social-links,
  .social-media-list {
    display: none !important;
  }

  /* ❌ Remove button */
  #printBtn {
    display: none !important;
  }

  /* ✅ Clean layout */
  body {
    font-size: 12px;
    line-height: 1.5;
  }

  .wrapper {
    max-width: 800px;
    margin: auto;
  }

  h1, h2, h3 {
    page-break-after: avoid;
  }

  p, li {
    page-break-inside: avoid;
  }
}
</style>
