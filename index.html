  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;

    }

    h1, h2 {
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;

<body>

  <h1>Your Name</h1>
  <p>Email | Phone | LinkedIn | GitHub</p>

  <div class="section">
    <h2>Summary</h2>

  </div>

  <div class="section">

    <p>Your experience details.</p>
  </div>

  <div class="section">
    <h2>Skills</h2>
    <p>List your skills.</p>
  </div>

  <div class="section">

</html>
